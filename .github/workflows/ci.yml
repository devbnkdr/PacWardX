name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install PySide6 pytest ruff
      - run: ruff check .
      - name: Root helper, installer and package syntax
        run: |
          python -m py_compile packaging/pacwardx-priv
          bash -n packaging/install.sh
          bash -n packaging/arch/PKGBUILD
          bash -n packaging/arch/pacwardx.install
      - name: Package builds
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/dist .
          unzip -l /tmp/dist/*.whl | grep -q pacwardx/ui/pacwardx.svg
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
