[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacwardx"
dynamic = ["version"]
description = "A calm, always-on security monitor for Arch Linux and CachyOS"
readme = "README.md"
license = "MIT"
authors = [{ name = "devbnkdr" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]
keywords = ["security", "arch-linux", "cachyos", "kde", "monitoring", "hardening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/devbnkdr/PacWardX"
Issues = "https://github.com/devbnkdr/PacWardX/issues"

[project.scripts]
pacwardx = "pacwardx.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pacwardx.__version__" }

[tool.setuptools.packages.find]
include = ["pacwardx*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.package-data]
"pacwardx.ui" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
